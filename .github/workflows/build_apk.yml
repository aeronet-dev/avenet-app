name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: flutter pub get

    - name: Regenerate Android Platform Files
      run: flutter create . --platforms=android --project-name=avenet_app

    - name: Disable Strict Analysis for Build
      run: |
        echo "analyzer:" > analysis_options.yaml
        echo "  strong-mode:" >> analysis_options.yaml
        echo "    implicit-casts: true" >> analysis_options.yaml
        echo "    implicit-dynamic: true" >> analysis_options.yaml
        echo "  errors:" >> analysis_options.yaml
        echo "    ignore:" >> analysis_options.yaml
        echo "      - argument_type_not_assignable" >> analysis_options.yaml
        echo "      - not_initialized_non_nullable_instance_field" >> analysis_options.yaml

    - name: Build Release APK
      run: flutter build apk --release --no-pub

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        

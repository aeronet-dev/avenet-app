name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'
        cache: true

    - name: Clean and Get Dependencies
      run: flutter clean && flutter pub get

    - name: Regenerate Android Platform Files
      run: flutter create . --platforms=android --project-name=avenet_app

    - name: Set Unique Application ID
      run: |
        GRADLE_FILE="android/app/build.gradle"
        if [ -f "$GRADLE_FILE" ]; then
          sed -i 's/applicationId "com.example.avenet_app"/applicationId "com.aeronet.avenetapp"/g' $GRADLE_FILE
          sed -i 's/applicationId "com.avenet.avenet"/applicationId "com.aeronet.avenetapp"/g' $GRADLE_FILE
        fi

    - name: Build Debug APK
      run: flutter build apk --debug --no-pub

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build/app/outputs/flutter-apk/app-debug.apk
